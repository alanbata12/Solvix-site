<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solvix — Earn with tasks and forex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0F1912; --panel:#16241A; --line:#28382C;
    --gold:#E8B54A; --ink:#F3F6F1; --ink-dim:#AEC0AC; --mint:#6FCF97; --danger:#E8746A;
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh}
  h1,h2,.brand{font-family:'Space Grotesk',system-ui,sans-serif}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px}
  header{padding:22px 0; border-bottom:1px solid var(--line)}
  nav{display:flex; justify-content:space-between; align-items:center}
  .brand{font-size:19px; font-weight:600}
  .brand span{color:var(--gold)}
  .hidden{display:none !important}

  /* auth card */
  .auth-screen{min-height:calc(100vh - 70px); display:flex; align-items:center; justify-content:center; padding:40px 20px}
  .auth-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px; width:100%; max-width:380px}
  .auth-card h1{font-size:22px; margin-bottom:6px}
  .auth-card p.sub{color:var(--ink-dim); font-size:14px; margin-bottom:22px}
